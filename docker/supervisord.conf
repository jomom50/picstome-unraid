; Picstome process supervisor.
; Started by the container entrypoint: supervisord -c /etc/supervisor/supervisord.conf -n

[program:minio]
command=/usr/local/bin/minio server /data/minio --address :9000 --console-address :9001
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=TERM
stopwaitsecs=20
environment=MINIO_ROOT_USER="%(ENV_MINIO_ROOT_USER)s",MINIO_ROOT_PASSWORD="%(ENV_MINIO_ROOT_PASSWORD)s",MINIO_BROWSER="off"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:minio-init]
command=/usr/local/bin/minio-init
priority=20
autostart=true
autorestart=false
startsecs=0
startretries=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
priority=30
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=40
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Photo processing and gallery ZIP archives are queued jobs. The worker timeout
; has to stay above PICSTOME_GALLERY_ARCHIVES_TIMEOUT (3600 by default).
[program:queue-worker]
command=/usr/local/bin/php /var/www/html/artisan queue:work --queue=default --tries=%(ENV_QUEUE_WORKER_TRIES)s --timeout=%(ENV_QUEUE_WORKER_TIMEOUT)s --sleep=1 --memory=512 --no-interaction
priority=50
user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Drives the scheduled tasks (expiring galleries, reminders, cleanup, FTP ingest)
; and the heartbeat shown on the admin queue page.
[program:scheduler]
command=/usr/local/bin/php /var/www/html/artisan schedule:work
priority=60
user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
