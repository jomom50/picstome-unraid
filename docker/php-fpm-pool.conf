; Loaded after the stock www.conf, so these values win.
[www]
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

user = www-data
group = www-data

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Gallery downloads of large RAW/video files regularly exceed the default.
request_terminate_timeout = 1200

; Laravel must see the container environment (APP_KEY, AWS_*, SMTP, ...).
clear_env = no

catch_workers_output = yes
decorate_workers_output = no

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
